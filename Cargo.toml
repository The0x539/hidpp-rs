[package]
name = "hidpp"
version = "0.1.0"
edition = "2024"

[dependencies]
bilge = "0.2.0"
bytemuck = { version = "1.21.0", features = [
  "extern_crate_alloc",
  "min_const_generics",
  "zeroable_atomics",
] }
crossbeam = "0.8.4"
deadpool = "0.12.2"
fortuples = "0.9.1"
hidapi = "2.6.3"
pollster = "0.4.0"
tinystr = "0.8.0"
tinyvec = { version = "1.8.1", features = ["grab_spare_slice"] }
